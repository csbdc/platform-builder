---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-scale-set_software-impex
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
      interval: 5m
  releaseName: software-impex-runners
  values:
    githubConfigUrl: "https://github.com/csbdc/software-impex"
    githubConfigSecret: actions-secret
