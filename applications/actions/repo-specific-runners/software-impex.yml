---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-scale-set-software-impex
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
      interval: 5m
  releaseName: software-impex-runners
  values:
    githubConfigUrl: "https://github.com/csbdc/software-impex"
    githubConfigSecret: actions-secret
    template:
      spec:
        containers:
          - name: runner
            image: harbor.home.arpa/library/actions-runner-buildkit@sha256:fdeb5f56d4618218b78137dae48f01fcc3812686803e49160a30d92e64abd250
            command: ["/home/runner/run.sh"]
          - name: buildkit
            image: harbor.home.arpa/library/moby/buildkit:rootless
            args:
              - --addr
              - tcp://127.0.0.1:1234
              - --oci-worker-no-process-sandbox
            volumeMounts:
              - name: harbor-ca
                mountPath: /usr/local/share/ca-certificates/harbor-ca.crt
                subPath: ca.crt
                readOnly: true
        volumes:
          - name: harbor-ca
            secret:
              name: harbor-ingress
