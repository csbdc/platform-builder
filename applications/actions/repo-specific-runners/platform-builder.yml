---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-scale-set-platform-builder
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
      interval: 5m
  releaseName: platform-builder-runners
  values:
    githubConfigUrl: "https://github.com/csbdc/platform-builder"
    githubConfigSecret: actions-secret
    template:
      spec:
        containers:
          - name: runner
            image: harbor.home.arpa/library/actions-runner-buildkit@sha256:fdeb5f56d4618218b78137dae48f01fcc3812686803e49160a30d92e64abd250
            command: ["/home/runner/run.sh"]
