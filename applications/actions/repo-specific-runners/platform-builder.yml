---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-scale-set_platform-builder
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
      interval: 5m
  releaseName: platform-builder-runners
  values:
    githubConfigUrl: "https://github.com/csbdc/platform-builder"
    githubConfigSecret: actions-secret
