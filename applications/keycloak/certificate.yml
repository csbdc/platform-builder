apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: default
spec:
  secretName: keycloak-tls
  issuerRef:
    kind: ClusterIssuer
    name: home-ca-issuer
  commonName: home.arpa
  dnsNames:
    - keycloak.home.arpa
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - digital signature
    - key encipherment
    - server auth
