---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actions
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux2-sync
  path: "./applications/actions"
  prune: true
  timeout: 1m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor
spec:
  dependsOn:
    - name: keycloak-operator
    - name: cert-manager
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux2-sync
  path: "./applications/harbor"
  prune: true
  timeout: 1m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak
spec:
  dependsOn:
    - name: keycloak-operator
    - name: cert-manager
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux2-sync
  path: "./applications/keycloak"
  prune: true
  timeout: 1m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux2-sync
  path: "./applications/metrics-server"
  prune: true
  timeout: 1m
