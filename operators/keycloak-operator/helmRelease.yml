apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-operator
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      version: "26.8"
      chart: keycloak-operator-helm
      sourceRef:
        kind: HelmRepository
        name: keycloak
      interval: 5m
  releaseName: keycloak-operator
